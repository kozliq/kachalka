name: Сборка

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python build.py
      - name: Упаковать (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item dist/Kachalka.exe Kachalka-Windows.exe
      - name: Упаковать (Mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Kachalka.app Kachalka-Mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kachalka-${{ runner.os }}
          path: |
            Kachalka-Windows.exe
            Kachalka-Mac.zip
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            Kachalka-Windows.exe
            Kachalka-Mac.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Kachalka-Windows.exe
            Kachalka-Mac.zip
